# Запуск сайта вместе с SQL Server одной командой:  docker compose up --build
# Сайт откроется на http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-PlantShop_Dev_2026!}"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__OnlineShop: "Server=db;Database=OnlineShop;User Id=sa;Password=${DB_PASSWORD:-PlantShop_Dev_2026!};TrustServerCertificate=True"
      # Почта и оплата (необязательно):
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__UserName: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-}"
      Smtp__ManagerEmail: "${MANAGER_EMAIL:-}"
      YooKassa__ShopId: "${YOOKASSA_SHOP_ID:-}"
      YooKassa__SecretKey: "${YOOKASSA_SECRET_KEY:-}"
    volumes:
      - uploads:/app/wwwroot/uploads

volumes:
  sqldata:
  uploads:
